<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NSW Senate Election 2025 - Select and Rank <title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      gap: 40px;
    }
    .column {
      border: 1px solid #ccc;
      padding: 10px;
      width: 300px;
      min-height: 400px;
    }
    .column h2 {
      text-align: center;
      font-size: 18px;
      margin-bottom: 10px;
    }
    .item {
      padding: 8px;
      margin: 4px 0;
      background: #f1f1f1;
      border: 1px solid #aaa;
      cursor: grab;
    }
    .ranked .item::before {
      counter-increment: rank;
      content: counter(rank) ". ";
      font-weight: bold;
    }
    .ranked {
      counter-reset: rank;
    }
  </style>
</head>
<body>
  <h1>Rank Political Parties</h1>
  <div class="container">
    <div class="column" id="available">
      <h2>Available Options</h2>
    </div>
    <div class="column ranked" id="ranked">
      <h2>Ranked List</h2>
    </div>
  </div>

  <script>
    const parties = [
      "A\tAnimal Justice Party",
      "B\tTNL",
      "C\tCitizens Party",
      "D\tSustainable Australia Party - Stop Overdevelopment / Corruption",
      "E\tThe Greens",
      "F\tUngrouped",
      "G\tLiberal",
      "H\tReason Australia",
      "I\tSocialist Alliance",
      "J\tFederal ICAC Now",
      "K\tAustralian Democrats",
      "L\tIndigenous - Aboriginal Party of Australia",
      "M\tShooters, Fishers and Farmers Party",
      "N\tSeniors United Party of Australia",
      "O\tInformed Medical Options Party",
      "P\tThe Great Australian Party",
      "Q\tLegalise Cannabis Australia",
      "R\tFUSION: Science, Pirate, Secular, Climate Emergency",
      "S\tPauline Hanson's One Nation",
      "T\tLiberal Democrats",
      "U\tAustralian Values Party",
      "V\tLabor",
      "W\tUnited Australia Party",
      "UG\tIndependent"
    ];

    const available = document.getElementById("available");
    const ranked = document.getElementById("ranked");

    parties.forEach(party => {
      const div = document.createElement("div");
      div.className = "item";
      div.draggable = true;
      div.textContent = party;
      available.appendChild(div);
    });

    document.querySelectorAll(".column").forEach(col => {
      col.addEventListener("dragover", e => {
        e.preventDefault();
        const afterEl = getDragAfterElement(col, e.clientY);
        const dragging = document.querySelector(".dragging");
        if (!dragging) return;
        if (afterEl == null) {
          col.appendChild(dragging);
        } else {
          col.insertBefore(dragging, afterEl);
        }
      });

      col.addEventListener("drop", () => {
        updateRanks();
      });
    });

    document.addEventListener("dragstart", e => {
      if (e.target.classList.contains("item")) {
        e.target.classList.add("dragging");
      }
    });

    document.addEventListener("dragend", e => {
      if (e.target.classList.contains("item")) {
        e.target.classList.remove("dragging");
      }
    });

    function getDragAfterElement(container, y) {
      const draggableElements = [...container.querySelectorAll('.item:not(.dragging)')];
      return draggableElements.reduce((closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        if (offset < 0 && offset > closest.offset) {
          return { offset: offset, element: child };
        } else {
          return closest;
        }
      }, { offset: Number.NEGATIVE_INFINITY }).element;
    }

    function updateRanks() {
      // Optional: do anything when ranks change
    }
  </script>
</body>
</html>
